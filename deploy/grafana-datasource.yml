apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus        # the dashboards refer to the data source by this uid
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 2s     # = scrape_interval in prometheus.yml, so rate() windows are sized right
