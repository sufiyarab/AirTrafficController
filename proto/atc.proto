// gRPC interfaces of the system.
//
//   service Node     gateway -> every Raft node (port 9090 on each node)
//   service Gateway  simulator and ground receivers -> gateway (port 9090)
//
// The Node service mirrors the node's HTTP endpoints one-to-one
// (cmd/node/main.go), so the gateway can use either transport behind its
// nodeClient interface (cmd/gateway/nodeclient.go, TRANSPORT=http|grpc).
//
// Generated Go code is committed in internal/atcpb. After editing this file,
// regenerate it (see README, "Regenerating the gRPC code"). The Python stubs
// for the simulator and receivers are committed in sim/ (atc_pb2*.py).
syntax = "proto3";
package atc;
option go_package = "atc/internal/atcpb";

message Empty {}

// One aircraft position report. The simulator fills callsign through
// speed_kt; the gateway adds sector, owner, status and verify before it
// multicasts the report to a sector's replicas.
message Position {
  string callsign = 1;
  uint64 seq = 2;          // per-aircraft sequence number: FIFO delivery check
  double x_nm = 3;
  double y_nm = 4;
  double alt_ft = 5;
  double heading_deg = 6;
  double speed_kt = 7;
  string sector = 8;       // sector the aircraft is physically in
  string owner = 9;        // sector that controls it, per the registry
  string status = 10;      // ACTIVE / TRANSFERRING
  string verify = 11;      // VERIFIED / UNVERIFIED / SUSPECT
}

message PositionBatch { repeated Position positions = 1; }

message NodeStatus {
  string id = 1;
  string cluster = 2;
  string state = 3;        // Leader, Follower, Candidate
  string leader_id = 4;
  string term = 5;
  string commit_index = 6;
}

// Same as fsm.Command. value is the op's JSON payload (fsm.Move, a clearance,
// a sector-map request), which the state machine already decodes.
message Command {
  string op = 1;
  string key = 2;
  bytes value = 3;
}

message ApplyReply {
  uint64 index = 1;        // Raft log index: the command's place in the total order
  bytes result_json = 2;   // state machine result (fsm.Owner, fsm.SectorMap) or empty
  bool not_leader = 3;     // replaces HTTP 421: retry on leader_id
  string leader_id = 4;
  bool rejected = 5;       // committed, but the state machine refused it (HTTP 400)
  string error = 6;
}

message Owner {
  string callsign = 1;
  string status = 2;       // ACTIVE / TRANSFERRING
  string sector = 3;
  string target = 4;       // set only while TRANSFERRING
  uint64 index = 5;
}

message OwnerTable { map<string, Owner> owners = 1; }

// The sector map and the full state are passed as JSON: their schema belongs
// to the state machine (internal/fsm) and changes with it.
message JSONBlob { bytes json = 1; }

service Node {
  rpc Status(Empty) returns (NodeStatus);
  rpc Apply(Command) returns (ApplyReply);        // leader only
  rpc Track(PositionBatch) returns (Empty);       // one B-multicast batch, unary (FIFO comes from the gateway's per-replica sender)
  rpc Owners(Empty) returns (OwnerTable);
  rpc Sectors(Empty) returns (JSONBlob);
  rpc State(Empty) returns (JSONBlob);
}

// One ground receiver's measurements for one tick (cmd/gateway/verify.go).
// An empty batch is a heartbeat: the receiver is up but hears nothing.
message Observation {
  string callsign = 1;
  uint64 seq = 2;
  double range_nm = 3;     // measured distance to the transmitter
}

message ObservationBatch {
  string receiver_id = 1;
  repeated Observation observations = 2;
}

// A recently committed clearance for an aircraft, so the simulator can fly
// it. clearance_id lets the simulator apply each clearance once even though
// the gateway repeats it in every reply (cmd/gateway/conflict_follow.go).
message Instruction {
  string callsign = 1;
  string clearance_id = 2;
  string instruction = 3;  // e.g. "CLIMB FL340", "HEADING 090", "REDUCE SPEED 250"
}

message Instructions { repeated Instruction instructions = 1; }

// Inputs from outside the Raft system. Unary, one call per tick, like Track.
service Gateway {
  rpc ReportPositions(PositionBatch) returns (Instructions); // simulator: claimed positions (callsign .. speed_kt); reply: committed clearances to fly
  rpc ReportObservations(ObservationBatch) returns (Empty);  // ground receivers
}
